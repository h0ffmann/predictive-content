[project]
name = "python-repo-template"
version = "0.0.1"
description = "A template for Python projects"
license = { text = "MIT" }
authors = [ { name = "Giovanni Giacometti", email = "giovanni.giacometti5@gmail.com" } ]
requires-python = "==3.12.*"
dependencies = [
    "shared",
    "duber",
]
[tool.uv]
override-dependencies = [
    "faster-whisper==1.2.1",
    "av==16.0.1",
    "numpy==1.26.4",
    "numba==0.60.0",
    "librosa==0.10.2",
    "transformers==4.36.2", # Safe range for coqui-tts 0.25.3 + your >=4.40 root req    "fugashi==1.4.0",
    "ctranslate2==4.4.0",
    "pandas>=2.2.0",

]
[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
    "pytest>=8.3.4",
    "ruff>=0.9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_repo_template"]

[tool.uv.sources]
shared = { workspace = true }
duber = { workspace = true }

[tool.uv.workspace]
members = ["packages/shared", "packages/duber", "submodules/openvoice"]
