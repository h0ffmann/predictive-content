[project]
name = "duber"
version = "0.0.1"
description = "Shared utilities module"
requires-python = ">=3.12,<3.13"
dependencies = [
    "shared",
    "myshell-openvoice",
    "wavmark>=0.0.3",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers",  # Will be overridden to 4.36.2
    "sentencepiece>=0.1.98",
    "melotts @ file:///home/hoffmann/playground/melotts-fork",  # Adjust path if cloned elsewhere (absolute recommended)
    "faster-whisper==1.2.1",
    "librosa==0.10.2",
    "numpy==1.26.4",
    "eng_to_ipa==0.0.2",
    "inflect==7.0.0",
    "unidecode==1.3.7",
    "whisper-timestamped==1.14.2",
    "openai",
    "python-dotenv",
    "pypinyin",
    "cn2an",
    "jieba",
    "mecab-python3",
    "numba==0.60.0",
    "ko_pron",
    "jamo",
    "gruut[de,es,fr,it]==2.2.3",  # From prior fix
    "punctuators",
    "pydub>=0.25.1",
    "tqdm>=4.64.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.0",
    "click>=8.1.0",
    "unidic-lite",
    "sacremoses",
    "tiktoken",
    "openai",
    "onnxruntime-gpu",
    "coqui-tts",
    "torchcodec"
]

[tool.uv]
override-dependencies = [
    "faster-whisper==1.2.1",
    "av==16.0.1",
    "numpy==1.26.4",
    "numba==0.60.0",
    "librosa==0.10.2",
    "transformers==4.36.2",  # From prior fix: Fixes BeamSearchScorer import
    "fugashi==1.5.2",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["duber"]

[project.scripts]
duber-cli = "duber:main"


[tool.uv.sources]
shared = { workspace = true }
myshell-openvoice = { workspace = true }

[tool.hatch.metadata]
allow-direct-references = true

