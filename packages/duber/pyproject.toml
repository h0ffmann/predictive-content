[project]
name = "shared"
version = "0.0.1"
description = "Shared utilities module"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "openai-whisper>=20231117",
    "faster-whisper>=0.10.0",
    "opencv-python>=4.8.0",
    "opencv-contrib-python>=4.8.0",
    "ffmpeg-python>=0.2.0",
    "moviepy>=1.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
py-modules = ["shared"]

[project.scripts]
shared-cli = "shared:main"